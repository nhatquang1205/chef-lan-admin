# /etc/nginx/sites-available/chef-lan-admin  (then: ln -s into sites-enabled, nginx -t, reload)
#
# A separate server block for the admin's own host, admin.bonbocon.com, next to the website's, the API's and
# wish-list's. nginx picks the block by hostname, so all of them share ports 80/443.
# Static files only: the admin calls the API directly at https://api.bonbocon.com (cross-origin, so the API's
# Cors__AllowedOrigins must list https://admin.bonbocon.com). No /api/ here.
# HTTPS: sudo certbot --nginx -d admin.bonbocon.com   (certbot adds the 443 listener and the redirect)

server {
    listen 80;
    listen [::]:80;
    server_name admin.bonbocon.com;

    root /var/www/chef-lan-admin/current;
    index index.html;

    # Staff only: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Built files have a content hash in their name, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SPA: every other path is the app, which does its own routing. index.html must never be cached,
    # or browsers keep loading the previous release's asset names after a deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
