# /etc/nginx/sites-available/chef-lan-admin  (then: ln -s into sites-enabled, nginx -t, reload)
#
# A separate server block for the admin's own domain, next to the website's and wish-list's. nginx picks
# the block by hostname, so all of them share ports 80/443.
# Replace <admin-domain> with the real hostname (the admin's domain, e.g. quantri-bonbocon.com).
# HTTPS: sudo certbot --nginx -d <admin-domain>   (certbot adds the 443 listener and the redirect)

server {
    listen 80;
    listen [::]:80;
    server_name <admin-domain>;

    root /var/www/chef-lan-admin/current;
    index index.html;

    # Staff only: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Built files have a content hash in their name, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SPA: every other path is the app, which does its own routing. index.html must never be cached,
    # or browsers keep loading the previous release's asset names after a deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The API, same-origin for the admin (no CORS needed). Same rules as the website's /api/ block.
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append: the API's login rate limit trusts this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;   # course create/update with a 5 MB thumbnail
    }

    # Video/image uploads are streamed through the API to Bunny/B2.
    location ^~ /api/v1/admins/uploads/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 8g;
        proxy_request_buffering off;   # do NOT spool multi-GB uploads to the VPS disk first
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
